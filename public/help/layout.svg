<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="840" height="420" fill="#f5f6f8"/>

  <!-- 左栏 -->
  <rect x="10" y="10" width="230" height="400" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <rect x="10" y="10" width="230" height="46" rx="8" fill="#E45A00"/>
  <rect x="10" y="40" width="230" height="16" fill="#E45A00"/>
  <text x="24" y="40" fill="#fff" font-size="15" font-weight="700">展牌管理</text>
  <rect x="150" y="22" width="40" height="22" rx="4" fill="#fff"/>
  <text x="162" y="37" fill="#E45A00" font-size="10" font-weight="700">帮助</text>
  <rect x="194" y="22" width="38" height="22" rx="4" fill="#fff"/>
  <text x="206" y="37" fill="#E45A00" font-size="10" font-weight="700">设置</text>
  <text x="24" y="60" fill="#999" font-size="11">🔍 搜索产品名称...</text>

  <rect x="22" y="80" width="206" height="26" rx="5" fill="#fff3ea"/>
  <text x="32" y="97" font-size="11" font-weight="700" fill="#555">▾ 手机</text>
  <text x="200" y="97" font-size="11" fill="#999">16</text>
  <rect x="22" y="106" width="206" height="30" rx="5" fill="#fff" stroke="#eee"/>
  <rect x="30" y="116" width="12" height="12" rx="3" fill="#E45A00"/>
  <text x="50" y="126" font-size="11" fill="#333">moto razr 60</text>
  <rect x="22" y="140" width="206" height="30" rx="5" fill="#fff" stroke="#eee"/>
  <rect x="30" y="150" width="12" height="12" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="50" y="160" font-size="11" fill="#333">拯救者 Y700</text>
  <rect x="22" y="174" width="206" height="26" rx="5" fill="#fff3ea"/>
  <text x="32" y="191" font-size="11" font-weight="700" fill="#555">▸ 平板</text>
  <text x="200" y="191" font-size="11" fill="#999">17</text>
  <rect x="22" y="200" width="206" height="26" rx="5" fill="#fff3ea"/>
  <text x="32" y="217" font-size="11" font-weight="700" fill="#555">▸ 台式机</text>
  <text x="200" y="217" font-size="11" fill="#999">15</text>

  <!-- 中栏 -->
  <rect x="252" y="10" width="350" height="400" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <text x="268" y="36" font-size="13" font-weight="700" fill="#333">展牌编辑</text>
  <line x1="252" y1="46" x2="602" y2="46" stroke="#eee"/>
  <rect x="266" y="58" width="322" height="24" rx="5" fill="#fafafa"/>
  <text x="276" y="74" font-size="11" font-weight="700" fill="#E45A00">▾ 卖点信息</text>
  <rect x="280" y="90" width="130" height="22" rx="4" fill="#f5f5f5"/>
  <text x="288" y="105" font-size="10" fill="#666">图标：内置 ▾</text>
  <rect x="418" y="90" width="156" height="22" rx="4" fill="#f5f5f5"/>
  <text x="426" y="105" font-size="10" fill="#666">关联文案 ▾</text>
  <rect x="280" y="118" width="294" height="22" rx="4" fill="#f5f5f5"/>
  <text x="288" y="133" font-size="10" fill="#666">标题</text>
  <rect x="280" y="146" width="294" height="22" rx="4" fill="#f5f5f5"/>
  <text x="288" y="161" font-size="10" fill="#666">副标题</text>
  <rect x="266" y="180" width="322" height="24" rx="5" fill="#fafafa"/>
  <text x="276" y="196" font-size="11" font-weight="700" fill="#555">▸ 产品价格配置</text>
  <rect x="266" y="212" width="322" height="24" rx="5" fill="#fafafa"/>
  <text x="276" y="228" font-size="11" font-weight="700" fill="#555">▸ 配件信息</text>
  <rect x="266" y="244" width="322" height="24" rx="5" fill="#fafafa"/>
  <text x="276" y="260" font-size="11" font-weight="700" fill="#555">▸ 服务信息</text>

  <rect x="266" y="286" width="322" height="110" rx="6" fill="#fff6ef" stroke="#ffd9bb"/>
  <text x="280" y="306" font-size="11" fill="#E45A00" font-weight="700">提示</text>
  <text x="280" y="326" font-size="10.5" fill="#666">输入「原价」后，系统按分类规则自动算出「国补价」</text>
  <text x="280" y="344" font-size="10.5" fill="#666">服务下拉已按分类隔离，编辑手机展牌只显示手机服务</text>
  <text x="280" y="362" font-size="10.5" fill="#666">自定义文案可点「保存到文案库」供其他卖点复用</text>

  <!-- 右栏 -->
  <rect x="614" y="10" width="216" height="400" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <text x="628" y="36" font-size="13" font-weight="700" fill="#333">实时预览</text>
  <line x1="614" y1="46" x2="830" y2="46" stroke="#eee"/>
  <rect x="632" y="60" width="180" height="330" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="644" y="88" font-size="12" font-weight="700" fill="#333">moto razr 60</text>
  <circle cx="644" cy="112" r="10" fill="#f0f0f0"/>
  <text x="662" y="116" font-size="9" fill="#888">超轻机身</text>
  <circle cx="644" cy="140" r="10" fill="#f0f0f0"/>
  <text x="662" y="144" font-size="9" fill="#888">影像系统</text>
  <text x="644" y="176" font-size="9" fill="#999">8GB+256GB 月绒黑</text>
  <text x="644" y="196" font-size="15" font-weight="800" fill="#E45A00">¥3499</text>
  <text x="700" y="196" font-size="10" fill="#bbb" text-decoration="line-through">¥3999</text>

  <!-- 标注 -->
  <text x="125" y="406" font-size="10" fill="#888" text-anchor="middle">① 选展牌</text>
  <text x="427" y="406" font-size="10" fill="#888" text-anchor="middle">② 改内容</text>
  <text x="722" y="406" font-size="10" fill="#888" text-anchor="middle">③ 看预览 / 打印</text>
</svg>
