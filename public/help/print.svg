<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="240" fill="#f5f6f8"/>

  <!-- 步骤1：勾选 -->
  <rect x="16" y="40" width="200" height="150" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <text x="28" y="62" font-size="12" font-weight="700" fill="#333">1. 勾选展牌</text>
  <rect x="28" y="76" width="176" height="28" rx="5" fill="#fff" stroke="#eee"/>
  <rect x="36" y="84" width="13" height="13" rx="3" fill="#E45A00"/>
  <path d="M39 90 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="58" y="95" font-size="10.5" fill="#333">moto razr 60</text>
  <rect x="28" y="110" width="176" height="28" rx="5" fill="#fff" stroke="#eee"/>
  <rect x="36" y="118" width="13" height="13" rx="3" fill="#E45A00"/>
  <path d="M39 124 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="58" y="129" font-size="10.5" fill="#333">拯救者 Y700</text>
  <rect x="28" y="144" width="176" height="28" rx="5" fill="#fff" stroke="#eee"/>
  <rect x="36" y="152" width="13" height="13" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="58" y="163" font-size="10.5" fill="#999">小新 Pad</text>

  <path d="M224 115 l24 0" stroke="#E45A00" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#E45A00"/></marker></defs>

  <!-- 步骤2：打印按钮 -->
  <rect x="260" y="40" width="180" height="150" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <text x="272" y="62" font-size="12" font-weight="700" fill="#333">2. 点「打印选中」</text>
  <rect x="282" y="88" width="136" height="32" rx="6" fill="#ff9900"/>
  <text x="350" y="109" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">🖨️ 打印选中（2）</text>
  <rect x="282" y="132" width="136" height="26" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="350" y="149" font-size="10" fill="#888" text-anchor="middle">删除选中（2）</text>

  <path d="M448 115 l24 0" stroke="#E45A00" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 步骤3：打印设置 -->
  <rect x="484" y="40" width="220" height="150" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <text x="496" y="62" font-size="12" font-weight="700" fill="#333">3. 浏览器打印设置</text>
  <text x="500" y="86" font-size="10.5" fill="#555">纸张：<tspan font-weight="700">A4</tspan></text>
  <text x="500" y="108" font-size="10.5" fill="#555">边距：<tspan font-weight="700">无 / 最小</tspan></text>
  <text x="500" y="130" font-size="10.5" fill="#555">页眉页脚：<tspan font-weight="700">关闭</tspan></text>
  <text x="500" y="152" font-size="10.5" fill="#555">比例：<tspan font-weight="700">100%</tspan></text>
  <rect x="500" y="164" width="90" height="22" rx="4" fill="#E45A00"/>
  <text x="545" y="179" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">打印</text>

  <text x="360" y="222" font-size="10.5" fill="#999" text-anchor="middle">每张展牌占一页，仅打印勾选项；未勾选则打印按钮不可用</text>
</svg>
