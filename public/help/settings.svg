<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="300" fill="#f5f6f8"/>

  <!-- 设置弹窗 -->
  <rect x="20" y="20" width="400" height="260" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <line x1="20" y1="58" x2="420" y2="58" stroke="#E45A00" stroke-width="2"/>
  <text x="36" y="46" font-size="14" font-weight="700" fill="#333">设置</text>

  <text x="36" y="84" font-size="12" font-weight="700" fill="#333">国补规则</text>
  <text x="36" y="102" font-size="10" fill="#999">补贴 = 原价 × 百分比，超过封顶按封顶计</text>

  <rect x="36" y="112" width="368" height="46" rx="6" fill="#fafafa"/>
  <text x="48" y="132" font-size="11" font-weight="600" fill="#555">电脑（笔记本 / 台式机）</text>
  <text x="48" y="150" font-size="10" fill="#888">百分比</text>
  <rect x="94" y="139" width="52" height="20" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="120" y="153" font-size="10" fill="#333" text-anchor="middle">15 %</text>
  <text x="164" y="150" font-size="10" fill="#888">封顶</text>
  <rect x="200" y="139" width="62" height="20" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="231" y="153" font-size="10" fill="#333" text-anchor="middle">1500 元</text>

  <rect x="36" y="166" width="368" height="46" rx="6" fill="#fafafa"/>
  <text x="48" y="186" font-size="11" font-weight="600" fill="#555">移动（手机 / 平板）</text>
  <text x="48" y="204" font-size="10" fill="#888">百分比</text>
  <rect x="94" y="193" width="52" height="20" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="120" y="207" font-size="10" fill="#333" text-anchor="middle">15 %</text>
  <text x="164" y="204" font-size="10" fill="#888">封顶</text>
  <rect x="200" y="193" width="62" height="20" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="231" y="207" font-size="10" fill="#333" text-anchor="middle">500 元</text>

  <rect x="36" y="222" width="66" height="24" rx="5" fill="#fff" stroke="#ddd"/>
  <text x="69" y="238" font-size="10" fill="#666" text-anchor="middle">恢复默认</text>
  <rect x="110" y="222" width="60" height="24" rx="5" fill="#E45A00"/>
  <text x="140" y="238" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">保存</text>
  <rect x="178" y="222" width="96" height="24" rx="5" fill="#ff9900"/>
  <text x="226" y="238" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">按新规则重算</text>

  <!-- 计算示例 -->
  <rect x="444" y="20" width="256" height="260" rx="8" fill="#fff" stroke="#e3e5e9"/>
  <text x="460" y="46" font-size="12" font-weight="700" fill="#333">计算示例</text>

  <text x="460" y="74" font-size="10.5" fill="#E45A00" font-weight="700">电脑档（封顶 1500）</text>
  <text x="460" y="94" font-size="10" fill="#555">12000 → 减 1500 → 10500</text>
  <text x="460" y="112" font-size="10" fill="#555">10000 → 减 1500 → 8500</text>
  <text x="460" y="130" font-size="10" fill="#555">5000 → 减 750 → 4250</text>

  <text x="460" y="160" font-size="10.5" fill="#E45A00" font-weight="700">移动档（封顶 500）</text>
  <text x="460" y="180" font-size="10" fill="#555">4000 → 15%=600 超顶 → 3500</text>
  <text x="460" y="198" font-size="10" fill="#555">3000 → 减 450 → 2550</text>
  <text x="460" y="216" font-size="10" fill="#555">2000 → 减 300 → 1700</text>

  <rect x="460" y="232" width="224" height="34" rx="5" fill="#fff6ef"/>
  <text x="470" y="247" font-size="9.5" fill="#E45A00">修改后点「保存」并二次确认才生效；</text>
  <text x="470" y="260" font-size="9.5" fill="#E45A00">「重算」会覆盖所有展牌现有国补价。</text>
</svg>
